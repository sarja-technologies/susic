[package]
name = "susic-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional self-hosted Susic music server (indexes a music directory and streams it to Susic clients)"

[lib]
name = "susic_server"

[[bin]]
name = "susic-server"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
susic-core = { path = "../susic-core" }
susic-import = { path = "../susic-import" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
toml = "0.8"
rand = "0.8"
blake3 = "1"
walkdir = "2"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
