name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libssl-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p apps/susic-app/dist && touch apps/susic-app/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/susic-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/susic-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  linux:
    name: Linux bundles (deb, AppImage)
    runs-on: ubuntu-24.04
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libssl-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/susic-app/package-lock.json
      - run: npm ci
        working-directory: apps/susic-app
      - run: npx tauri build --bundles deb,appimage
        working-directory: apps/susic-app
        env:
          NO_STRIP: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: susic-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/susic-app/package-lock.json
      - run: npm ci
        working-directory: apps/susic-app
      - name: Build debug APK
        working-directory: apps/susic-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: npx tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: susic-android-debug
          path: apps/susic-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
