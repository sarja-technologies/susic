name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libssl-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm test
        working-directory: apps/susic-app
      - run: cargo test --workspace
      - run: npx tauri build --bundles deb,appimage
        working-directory: apps/susic-app
        env: { NO_STRIP: "true" }
      - name: Server tarball
        run: |
          cargo build --release -p susic-server
          mkdir -p dist/susic-server
          cp target/release/susic-server deploy/susic-server.service deploy/server.example.toml deploy/install-server.sh dist/susic-server/
          tar -C dist -czf target/release/bundle/susic-server-linux-x86_64.tar.gz susic-server
      - name: Checksums
        run: cd target/release/bundle && sha256sum deb/*.deb appimage/*.AppImage susic-server-linux-x86_64.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/susic-server-linux-x86_64.tar.gz
            target/release/bundle/SHA256SUMS.txt
