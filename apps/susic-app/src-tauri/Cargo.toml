[package]
name = "susic-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Susic — offline-first music library and player"

[lib]
name = "susic_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
susic-core = { path = "../../../crates/susic-core" }
susic-library = { path = "../../../crates/susic-library" }
susic-import = { path = "../../../crates/susic-import" }
susic-sync = { path = "../../../crates/susic-sync" }
tauri-plugin-susic-player = { path = "../../../crates/tauri-plugin-susic-player" }
ureq = { version = "2", features = ["json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2.190"
tauri-plugin-opener = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
souvlaki = "0.8"
